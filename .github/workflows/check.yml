name: Public package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check_publication.py
      - run: sh scripts/check_publication.self-test.sh
      - run: python3 skills/digital-employee/scripts/check_method.py --check
      - run: sh skills/digital-employee/scripts/check_method.self-test.sh
      - run: python3 -B -m unittest discover -s skills/notebook-secretary/scripts -p 'test_*.py' -v
      - run: node --test skills/codex-thread-handoff/scripts/queue_closeout.test.mjs
